<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">FrontierTrials: compare AI products without knowing which answer came from which product</title>
  <desc id="desc">A concrete three-step example shows exact web-app answers being saved, reviewed under anonymous labels, and revealed only after voting is complete.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5C7489"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="10" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1438" height="618" rx="9" fill="none" stroke="#D4D1C8" stroke-width="2"/>
  <rect width="1440" height="12" rx="10" fill="#17324D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="54" fill="#985047" font-size="14" font-weight="700" letter-spacing="3">BLIND HUMAN EVALUATION — NO API KEYS</text>
    <text x="720" y="122" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">FrontierTrials</text>
    <text x="720" y="161" fill="#59676F" font-size="20">Compare AI web-app answers without letting product names influence the review.</text>
    <text x="720" y="194" fill="#7A7064" font-size="13">FICTIONAL ENGINEERING-ASSISTANT TRIAL</text>
  </g>

  <path d="M442 354H512M912 354H982" fill="none" stroke="#5C7489" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(60 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#E9EEF2"/>
      <rect y="44" width="382" height="8" fill="#E9EEF2"/>
      <circle cx="191" cy="0" r="22" fill="#17324D"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">1</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">COLLECT THE SAME TASK</text>
      <text x="191" y="82" fill="#59676F" font-size="13">Copy one prompt into each AI product</text>
      <rect x="34" y="101" width="314" height="74" rx="6" fill="#F7F6F2" stroke="#DDD9D0"/>
      <text x="191" y="127" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">“Explain why this converter rings</text>
      <text x="191" y="149" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="14" font-weight="700">and propose two safe checks.”</text>
      <text x="191" y="204" fill="#354A55" font-size="13">Save both exact answers</text>
      <text x="191" y="229" fill="#59676F" font-size="12">Record product label, date, settings, and interface</text>
      <text x="191" y="253" fill="#5C7489" font-size="11" font-weight="800">FILES ARE HASHED AFTER CAPTURE</text>
    </g>

    <g transform="translate(529 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#F2E9E8"/>
      <rect y="44" width="382" height="8" fill="#F2E9E8"/>
      <circle cx="191" cy="0" r="22" fill="#985047"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">2</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">REVIEW WITHOUT NAMES</text>
      <text x="191" y="82" fill="#59676F" font-size="13">The reviewer sees aliases, not products</text>
      <rect x="40" y="103" width="132" height="54" rx="6" fill="#F7F6F2" stroke="#CBD1D4"/>
      <text x="106" y="126" fill="#5C7489" font-size="11" font-weight="800">ANSWER</text>
      <text x="106" y="146" fill="#172635" font-size="14" font-weight="800">EMBER</text>
      <text x="191" y="136" fill="#985047" font-family="Georgia, Times New Roman, serif" font-size="17" font-style="italic">vs</text>
      <rect x="210" y="103" width="132" height="54" rx="6" fill="#F7F6F2" stroke="#CBD1D4"/>
      <text x="276" y="126" fill="#5C7489" font-size="11" font-weight="800">ANSWER</text>
      <text x="276" y="146" fill="#172635" font-size="14" font-weight="800">MOSS</text>
      <text x="191" y="194" fill="#172635" font-size="13" font-weight="700">Reviewer chooses: EMBER</text>
      <text x="191" y="220" fill="#59676F" font-size="12">Reason: clearer diagnosis and safer checks</text>
      <text x="191" y="251" fill="#985047" font-size="11" font-weight="800">PRODUCT IDENTITIES STILL HIDDEN</text>
    </g>

    <g transform="translate(998 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#F3ECDD"/>
      <rect y="44" width="382" height="8" fill="#F3ECDD"/>
      <circle cx="191" cy="0" r="22" fill="#B07A2A"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">3</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">REVEAL AND CHECK</text>
      <text x="191" y="82" fill="#59676F" font-size="13">Only after every assigned review is complete</text>
      <text x="191" y="119" fill="#172635" font-size="14" font-weight="700">EMBER = Product X</text>
      <text x="191" y="146" fill="#172635" font-size="14" font-weight="700">MOSS = Product Y</text>
      <line x1="48" y1="169" x2="334" y2="169" stroke="#DDD9D0"/>
      <text x="191" y="198" fill="#59676F" font-size="12">Would the result change if one reviewer</text>
      <text x="191" y="218" fill="#59676F" font-size="12">were removed from this fictional panel?</text>
      <rect x="133" y="232" width="116" height="25" rx="12" fill="#E3EEE8"/>
      <text x="191" y="249" fill="#2F6B55" font-size="11" font-weight="800">NO — STABLE</text>
    </g>

    <line x1="60" y1="535" x2="1380" y2="535" stroke="#D4D1C8"/>
    <text x="720" y="572" fill="#17324D" font-size="16" font-weight="700">The tool records how a local decision was made; it does not claim a universal model ranking.</text>
    <text x="720" y="596" fill="#69757B" font-size="12">All products and results shown above are fictional.</text>
  </g>
</svg>
