<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FrontierTrials blind evaluation protocol</title>
  <desc id="desc">Two anonymous responses are reviewed before an identity reveal boundary and an uncertainty-aware result.</desc>
