<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">FrontierTrials personal AI subscription benchmark</title>
  <desc id="desc">A clean three-stage diagram shows a user pasting exact AI product answers, comparing them under anonymous labels, and receiving a limited personal decision rather than a universal leaderboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#607889"/>
    </marker>
  </defs>

  <rect width="1440" height="700" rx="14" fill="#F4F1E8"/>
  <rect x="1" y="1" width="1438" height="698" rx="13" fill="none" stroke="#C9C5BA" stroke-width="2"/>
  <rect width="1440" height="14" rx="14" fill="#20384A"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="68" fill="#965247" font-size="14" font-weight="800" letter-spacing="3">PRIVATE PERSONAL BENCHMARK · NO API KEYS</text>
    <text x="720" y="142" fill="#17232A" font-family="Georgia, Times New Roman, serif" font-size="62" font-weight="700">Which AI subscription should you keep?</text>
    <text x="720" y="184" fill="#637078" font-size="20">Compare the products you already use on the work you actually do.</text>

    <path d="M424 393H500M940 393H1016" fill="none" stroke="#607889" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(58 244)">
      <rect width="366" height="298" fill="#FFFDF7" stroke="#C9C5BA" stroke-width="1.5"/>
      <rect width="366" height="58" fill="#E5ECEE"/>
      <circle cx="42" cy="29" r="17" fill="#20384A"/>
      <text x="42" y="34" fill="#FFFFFF" font-size="12" font-weight="800">1</text>
      <text x="198" y="35" fill="#20384A" font-size="14" font-weight="800" letter-spacing="1.2">PASTE EXACT ANSWERS</text>

      <text x="183" y="92" fill="#637078" font-size="13">One real task, two or more products</text>
      <rect x="28" y="113" width="310" height="54" fill="#F7F5EE" stroke="#D4D0C5"/>
      <text x="183" y="136" fill="#17232A" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="700">Explain this paper figure and identify</text>
      <text x="183" y="155" fill="#17232A" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="700">the highest-value follow-up experiment.</text>

      <rect x="28" y="186" width="146" height="58" fill="#FFFFFF" stroke="#8D9494"/>
      <text x="101" y="210" fill="#637078" font-size="10" font-weight="800">PRODUCT A</text>
      <text x="101" y="231" fill="#28766D" font-size="12" font-weight="800">EXACT OUTPUT</text>
      <rect x="192" y="186" width="146" height="58" fill="#FFFFFF" stroke="#8D9494"/>
      <text x="265" y="210" fill="#637078" font-size="10" font-weight="800">PRODUCT B</text>
      <text x="265" y="231" fill="#28766D" font-size="12" font-weight="800">EXACT OUTPUT</text>

      <text x="183" y="275" fill="#28766D" font-size="11" font-weight="800">SAVED IN YOUR BROWSER</text>
    </g>

    <g transform="translate(500 244)">
      <rect width="440" height="298" fill="#FFFDF7" stroke="#C9C5BA" stroke-width="1.5"/>
      <rect width="440" height="58" fill="#F1E6E3"/>
      <circle cx="42" cy="29" r="17" fill="#965247"/>
      <text x="42" y="34" fill="#FFFFFF" font-size="12" font-weight="800">2</text>
      <text x="236" y="35" fill="#20384A" font-size="14" font-weight="800" letter-spacing="1.2">COMPARE WITHOUT LABELS</text>

      <text x="220" y="92" fill="#637078" font-size="13">Judge the work while product names are off screen</text>
      <rect x="28" y="115" width="167" height="98" fill="#FFFFFF" stroke="#8D9494"/>
      <text x="112" y="141" fill="#28766D" font-size="11" font-weight="800">RESPONSE A · CEDAR</text>
      <line x1="48" y1="160" x2="175" y2="160" stroke="#C9C5BA"/>
      <line x1="48" y1="177" x2="160" y2="177" stroke="#C9C5BA"/>
      <line x1="48" y1="194" x2="182" y2="194" stroke="#C9C5BA"/>
      <text x="220" y="170" fill="#965247" font-family="Georgia, Times New Roman, serif" font-size="17" font-style="italic">versus</text>
      <rect x="245" y="115" width="167" height="98" fill="#FFFFFF" stroke="#8D9494"/>
      <text x="329" y="141" fill="#28766D" font-size="11" font-weight="800">RESPONSE B · KESTREL</text>
      <line x1="265" y1="160" x2="392" y2="160" stroke="#C9C5BA"/>
      <line x1="265" y1="177" x2="375" y2="177" stroke="#C9C5BA"/>
      <line x1="265" y1="194" x2="399" y2="194" stroke="#C9C5BA"/>

      <rect x="28" y="231" width="118" height="38" fill="#20384A"/>
      <text x="87" y="255" fill="#FFFFFF" font-size="11" font-weight="800">A IS BETTER</text>
      <rect x="161" y="231" width="118" height="38" fill="#FFFFFF" stroke="#20384A"/>
      <text x="220" y="255" fill="#20384A" font-size="11" font-weight="800">ABOUT EQUAL</text>
      <rect x="294" y="231" width="118" height="38" fill="#FFFFFF" stroke="#20384A"/>
      <text x="353" y="255" fill="#20384A" font-size="11" font-weight="800">B IS BETTER</text>
    </g>

    <g transform="translate(1016 244)">
      <rect width="366" height="298" fill="#FFFDF7" stroke="#C9C5BA" stroke-width="1.5"/>
      <rect width="366" height="58" fill="#F1E9D9"/>
      <circle cx="42" cy="29" r="17" fill="#A47A36"/>
      <text x="42" y="34" fill="#FFFFFF" font-size="12" font-weight="800">3</text>
      <text x="199" y="35" fill="#20384A" font-size="14" font-weight="800" letter-spacing="1.2">REVEAL A LIMITED RESULT</text>

      <text x="183" y="91" fill="#637078" font-size="13">A useful decision with its boundary attached</text>
      <rect x="28" y="114" width="310" height="82" fill="#F7F1E4" stroke="#D5C18E"/>
      <text x="183" y="142" fill="#965247" font-size="10" font-weight="800">THIS TASK FAVORED</text>
      <text x="183" y="174" fill="#17232A" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700">Product A</text>

      <g text-anchor="start" font-size="11">
        <text x="40" y="225" fill="#637078">Category</text>
        <text x="150" y="225" fill="#20384A" font-weight="700">research</text>
        <text x="40" y="247" fill="#637078">Judged pairs</text>
        <text x="150" y="247" fill="#20384A" font-weight="700">1</text>
        <text x="40" y="269" fill="#637078">Conclusion</text>
        <text x="150" y="269" fill="#20384A" font-weight="700">early signal only</text>
      </g>
    </g>

    <line x1="58" y1="585" x2="1382" y2="585" stroke="#C9C5BA"/>
    <text x="720" y="625" fill="#20384A" font-size="16" font-weight="700">Quick Compare for one person · Personal Benchmark across tasks · Study Mode for research teams</text>
    <text x="720" y="656" fill="#637078" font-size="13">Use Arena for public exploration. Use FrontierTrials for private, recurring work from the interfaces you actually pay for.</text>
  </g>
</svg>
