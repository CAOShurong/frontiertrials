<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">FrontierTrials evaluation lifecycle</title>
  <desc id="desc">Seven stages preserve responses, hide identity, collect ballots, diagnose bias, and reveal results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7167aa"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17162e" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1100" height="590" rx="24" fill="#f1eee6"/>
  <text x="60" y="70" fill="#17162e" font-family="Georgia,serif" font-size="38" font-weight="700">A ranking with a chain of custody</text>
  <text x="60" y="101" fill="#6a6873" font-family="system-ui,sans-serif" font-size="15">Every arrow creates evidence another reviewer can inspect.</text>
  <path d="M178 218h86M382 218h86M586 218h86M790 218h86M944 276v84M876 421h-86M672 421h-86M468 421h-86M264 421h-86" fill="none" stroke="#7167aa" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif" filter="url(#s)">
    <g transform="translate(60 160)"><rect width="118" height="116" rx="15" fill="#211e3d"/><text x="17" y="29" fill="#b9ef6f" font-size="11" font-weight="900">01</text><text x="17" y="59" fill="#fff" font-size="16" font-weight="800">Freeze</text><text x="17" y="82" fill="#b9b5cc" font-size="11">Tasks + rubric</text></g>
    <g transform="translate(264 160)"><rect width="118" height="116" rx="15" fill="#fffdf8"/><text x="17" y="29" fill="#7167aa" font-size="11" font-weight="900">02</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="800">Capture</text><text x="17" y="82" fill="#6a6873" font-size="11">Exact outputs</text></g>
    <g transform="translate(468 160)"><rect width="118" height="116" rx="15" fill="#fffdf8"/><text x="17" y="29" fill="#7167aa" font-size="11" font-weight="900">03</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="800">Hash</text><text x="17" y="82" fill="#6a6873" font-size="11">Verify bytes</text></g>
    <g transform="translate(672 160)"><rect width="118" height="116" rx="15" fill="#fffdf8"/><text x="17" y="29" fill="#7167aa" font-size="11" font-weight="900">04</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="800">Blind</text><text x="17" y="82" fill="#6a6873" font-size="11">Alias + balance</text></g>
    <g transform="translate(876 160)"><rect width="118" height="116" rx="15" fill="#fffdf8"/><text x="17" y="29" fill="#7167aa" font-size="11" font-weight="900">05</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="800">Judge</text><text x="17" y="82" fill="#6a6873" font-size="11">Offline packets</text></g>
    <g transform="translate(672 363)"><rect width="118" height="116" rx="15" fill="#fffdf8"/><text x="17" y="29" fill="#7167aa" font-size="11" font-weight="900">06</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="800">Diagnose</text><text x="17" y="82" fill="#6a6873" font-size="11">Bias + intervals</text></g>
    <g transform="translate(264 363)"><rect width="118" height="116" rx="15" fill="#ffad83"/><text x="17" y="29" fill="#3b2740" font-size="11" font-weight="900">07</text><text x="17" y="59" fill="#17162e" font-size="16" font-weight="900">Reveal</text><text x="17" y="82" fill="#533e4c" font-size="11">Seal + report</text></g>
  </g>
  <rect x="60" y="519" width="934" height="36" rx="10" fill="#dfdbd0"/>
  <text x="527" y="542" text-anchor="middle" fill="#5f5c68" font-family="system-ui,sans-serif" font-size="12">Observed preference in one protocol is not general intelligence, factual truth, or provider-certified model identity.</text>
</svg>
