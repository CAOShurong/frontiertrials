<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">FrontierTrials evidence lifecycle</title>
  <desc id="desc">Six stages lead from protocol design through blind adjudication to reveal, analysis, and evidence sealing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526f87"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#f5f2eb"/>
  <rect x="1" y="1" width="1198" height="438" fill="none" stroke="#cbc5b9" stroke-width="2"/>
  <text x="55" y="57" fill="#1c252c" font-family="Georgia,serif" font-size="32" font-weight="700">An evaluation with a recorded reveal boundary</text>
  <text x="55" y="85" fill="#5e686e" font-family="system-ui,sans-serif" font-size="13">Files, assignments, and decisions remain inspectable at every stage.</text>

  <path d="M204 205H243M390 205H429M576 205H615M762 205H801M948 205H987" fill="none" stroke="#526f87" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="system-ui,sans-serif">
    <g transform="translate(55 139)">
      <rect width="149" height="132" fill="#fffefa" stroke="#cbc5b9"/>
      <rect width="149" height="6" fill="#24384c"/>
      <text x="15" y="31" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700">01</text>
      <text x="15" y="60" fill="#1c252c" font-family="Georgia,serif" font-size="19" font-weight="700">Pre-specify</text>
      <text x="15" y="87" fill="#5e686e" font-size="11">Tasks, rubric, limits</text>
      <text x="15" y="106" fill="#5e686e" font-size="11">before results</text>
    </g>
    <g transform="translate(241 139)">
      <rect width="149" height="132" fill="#fffefa" stroke="#cbc5b9"/>
      <rect width="149" height="6" fill="#526f87"/>
      <text x="15" y="31" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700">02</text>
      <text x="15" y="60" fill="#1c252c" font-family="Georgia,serif" font-size="19" font-weight="700">Capture</text>
      <text x="15" y="87" fill="#5e686e" font-size="11">Exact outputs</text>
      <text x="15" y="106" fill="#5e686e" font-size="11">and SHA-256</text>
    </g>
    <g transform="translate(427 139)">
      <rect width="149" height="132" fill="#fffefa" stroke="#cbc5b9"/>
      <rect width="149" height="6" fill="#526f87"/>
      <text x="15" y="31" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700">03</text>
      <text x="15" y="60" fill="#1c252c" font-family="Georgia,serif" font-size="19" font-weight="700">Blind</text>
      <text x="15" y="87" fill="#5e686e" font-size="11">Aliases, balance,</text>
      <text x="15" y="106" fill="#5e686e" font-size="11">assignments</text>
    </g>
    <g transform="translate(613 139)">
      <rect width="149" height="132" fill="#fffefa" stroke="#cbc5b9"/>
      <rect width="149" height="6" fill="#a4772d"/>
      <text x="15" y="31" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700">04</text>
      <text x="15" y="60" fill="#1c252c" font-family="Georgia,serif" font-size="19" font-weight="700">Judge</text>
      <text x="15" y="87" fill="#5e686e" font-size="11">Offline packets</text>
      <text x="15" y="106" fill="#5e686e" font-size="11">and rationales</text>
    </g>
    <g transform="translate(799 139)">
      <rect width="149" height="132" fill="#fffefa" stroke="#cbc5b9"/>
      <rect width="149" height="6" fill="#934b45"/>
      <text x="15" y="31" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700">05</text>
      <text x="15" y="60" fill="#1c252c" font-family="Georgia,serif" font-size="19" font-weight="700">Adjudicate</text>
      <text x="15" y="87" fill="#5e686e" font-size="11">Disputes reviewed</text>
      <text x="15" y="106" fill="#5e686e" font-size="11">while still blind</text>
    </g>
    <g transform="translate(985 139)">
      <rect width="160" height="132" fill="#24384c" stroke="#24384c"/>
      <rect width="160" height="6" fill="#934b45"/>
      <text x="15" y="31" fill="#e8cbc7" font-family="ui-monospace,monospace" font-size="10" font-weight="700">06</text>
      <text x="15" y="60" fill="#fffefa" font-family="Georgia,serif" font-size="19" font-weight="700">Reveal + test</text>
      <text x="15" y="87" fill="#d5dce1" font-size="11">Rank, sensitivity,</text>
      <text x="15" y="106" fill="#d5dce1" font-size="11">report, and seal</text>
    </g>
  </g>

  <path d="M55 322H1145" stroke="#934b45" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="55" y="349" fill="#934b45" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="1.2">IDENTITIES WITHHELD ABOVE THIS LINE UNTIL ASSIGNED BALLOTS ARE COMPLETE</text>
  <rect x="55" y="374" width="1090" height="34" fill="#e9e5dc"/>
  <text x="600" y="396" text-anchor="middle" fill="#5e686e" font-family="system-ui,sans-serif" font-size="11">Preference evidence is conditional on the recorded tasks, interfaces, settings, dates, and reviewer panel.</text>
</svg>
