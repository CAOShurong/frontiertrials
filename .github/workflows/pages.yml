name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p public/demo public/assets public/schemas
          cp site/index.html site/styles.css site/404.html public/
          cp docs/assets/*.svg public/assets/
          cp examples/demo/reports/trial-report.html public/demo/
          cp examples/demo/packets/reviewer-one.html public/demo/
          cp examples/demo/reports/ranking.csv public/demo/
          cp examples/demo/reports/protocol.md public/demo/
          cp schemas/*.json public/schemas/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
