name: Feature request
description: Propose an improvement to the evaluation protocol or software.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Evaluation problem
      description: What decision or failure mode cannot be handled reliably today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, and how another person could verify the result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This proposal does not require FrontierTrials to automate a provider interface or call a model.
          required: true
