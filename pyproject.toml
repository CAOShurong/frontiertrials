[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiertrials"
version = "0.3.0"
description = "Private personal benchmarks and rigorous blind studies for AI subscription outputs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shurong Cao" }]
dependencies = []
keywords = [
  "llm-evaluation",
  "blind-evaluation",
  "human-evaluation",
  "no-api",
  "frontier-models",
  "personal-benchmark",
  "ai-subscriptions",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://caoshurong.github.io/frontiertrials/"
Repository = "https://github.com/CAOShurong/frontiertrials"
Issues = "https://github.com/CAOShurong/frontiertrials/issues"

[project.scripts]
frontiertrials = "frontiertrials.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontiertrials = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
